<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Timers</title>
    <script defer>
        // ===========================================================
        // START: JAVASCRIPT LOGIC FOR PERSISTENCE (FROM PREVIOUS)
        // ===========================================================

        // --- Stopwatch Class (Copied from previous working version) ---
        class Stopwatch {
            constructor(displayElement) {
                this.startTime = null;
                this.elapsedTime = 0;
                this.timerInterval = null;
                this.displayElement = displayElement;
                this.isRunning = false;
                 // References added in createRow
                this.rowElement = null;
                this.startButton = null;
                this.stopButton = null;
                this.resetButton = null; // Added reference for completeness
            }

            formatTime(milliseconds) {
                const totalSeconds = Math.floor(milliseconds / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const ms = Math.floor((milliseconds % 1000) / 10); // Two digits for ms
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
            }

            start() {
                if (this.timerInterval) return; // Already running

                // Stop all other running timers
                const allRows = document.querySelectorAll('.row');
                allRows.forEach(row => {
                    // Check if it's a different row and its stopwatch is running
                    if (row !== this.rowElement && row.stopwatch && row.stopwatch.isRunning) {
                         console.log(`Stopping timer in row: ${row.querySelector('.task-input')?.value || 'Untitled'}`);
                        row.stopwatch.stop();
                    }
                });

                this.startTime = Date.now() - this.elapsedTime;
                this.timerInterval = setInterval(() => {
                    this.elapsedTime = Date.now() - this.startTime;
                    this.displayElement.textContent = this.formatTime(this.elapsedTime);
                    // Show the running time in the browser tab so it's visible from other tabs
                    const name = this.rowElement?.querySelector('.task-input')?.value.trim();
                    document.title = `${this.formatTime(this.elapsedTime).slice(0, -3)} · ${name || 'Untitled'}`;
                }, 10); // Update every 10ms for smooth display

                this.isRunning = true;

                // Update button states and visual indication
                if (this.startButton) this.startButton.disabled = true;
                if (this.stopButton) this.stopButton.disabled = false;
                if (this.resetButton) this.resetButton.disabled = false; // Enable reset when running
                if (this.rowElement) this.rowElement.classList.add('running');
                updateLocalStorage(); // Save state when timer starts
            }

            stop() {
                 if (!this.timerInterval) return; // Already stopped
                clearInterval(this.timerInterval);
                this.timerInterval = null;
                this.isRunning = false;
                this.elapsedTime = Date.now() - this.startTime;
                this.displayElement.textContent = this.formatTime(this.elapsedTime);
                document.title = DEFAULT_TITLE;

                // Update button states and visual indication
                if (this.startButton) this.startButton.disabled = false;
                // Keep stop button enabled after stopping if there's elapsed time
                if (this.stopButton) this.stopButton.disabled = this.elapsedTime === 0;
                if (this.resetButton) this.resetButton.disabled = this.elapsedTime === 0;
                if (this.rowElement) this.rowElement.classList.remove('running');
                updateLocalStorage(); // Save state when timer stops
            }

            reset() {
                const wasRunning = this.isRunning;
                this.stop(); // Stop first
                this.elapsedTime = 0;
                this.displayElement.textContent = this.formatTime(this.elapsedTime);
                // Reset button states
                 if (this.startButton) this.startButton.disabled = false;
                 if (this.stopButton) this.stopButton.disabled = true; // Stop disabled after reset
                 if (this.resetButton) this.resetButton.disabled = true; // Reset disabled after reset
                 if (wasRunning) updateLocalStorage(); // Save state only if it was running before reset
                 else if (this.rowElement?.parentNode) updateLocalStorage(); // Save even if not running if row exists
            }
        }

        const DEFAULT_TITLE = 'Task Timers';

        // --- Global Variables for Backup State ---
        let fetchedLastBackupISOString = null; // Store ISO string from DB
        let sessionLastBackupTime = null;      // Store Date object from current session's backup
        let nextScheduledBackup = null;
        let backupTimeout = null; // Keep track of the timeout ID

        // --- Core Functions (Add/Remove/Create Row - Adjusted slightly for robustness) ---
        function addRow() {
            const rowContainer = document.getElementById('rows');
            const row = createRow(); // Create with default time and no name
            rowContainer.appendChild(row);
            updateLocalStorage(); // Save after adding
             row.querySelector('.task-input').focus(); // Focus new task input
        }

        function removeRow() {
            const rowContainer = document.getElementById('rows');
            if (rowContainer.children.length > 1) {
                const lastRow = rowContainer.lastChild;
                const lastName = lastRow.querySelector('.task-input').value.trim();
                const hasData = lastName !== '' || (lastRow.stopwatch && lastRow.stopwatch.elapsedTime > 0);
                if (hasData && !confirm(`Remove the last row${lastName ? ` ("${lastName}")` : ''} and its recorded time?`)) {
                    return;
                }
                if (lastRow.stopwatch && lastRow.stopwatch.isRunning) {
                    lastRow.stopwatch.stop(); // Stop timer before removing
                }
                rowContainer.removeChild(lastRow);
                updateLocalStorage(); // Save after removing
            } else {
                 showNotification("Cannot remove the last row.", "warning");
            }
        }

        // Modified createRow to match expected behavior from stopwatch class
        function createRow(existingTime = '00:00.00', taskName = '') {
            const row = document.createElement('div');
            row.className = 'row';

            const stopwatchDisplay = document.createElement('span');
            stopwatchDisplay.textContent = existingTime;
            stopwatchDisplay.className = 'stopwatch';

            const taskInput = document.createElement('input');
            taskInput.type = 'text';
            taskInput.placeholder = 'Task Name';
            taskInput.className = 'task-input';
            taskInput.value = taskName;
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    taskInput.blur();
                }
            });
            taskInput.addEventListener('input', updateLocalStorage); // Save name changes

            const startButton = document.createElement('button');
            startButton.textContent = 'Start';
            startButton.className = 'start-btn';

            const stopButton = document.createElement('button');
            stopButton.textContent = 'Stop';
            stopButton.className = 'stop-btn';

            const resetButton = document.createElement('button');
            resetButton.textContent = 'Reset';
            resetButton.className = 'reset-btn';

            // Create and configure stopwatch instance
            const stopwatch = new Stopwatch(stopwatchDisplay);
            stopwatch.rowElement = row;
            stopwatch.startButton = startButton;
            stopwatch.stopButton = stopButton;
            stopwatch.resetButton = resetButton; // Assign reset button reference
            row.stopwatch = stopwatch; // Store reference on the row element

            // Set initial elapsed time and button states correctly
            if (existingTime !== '00:00.00') {
                stopwatch.elapsedTime = timeStringToMilliseconds(existingTime);
            }
            // Set initial button states based on elapsed time
            stopButton.disabled = stopwatch.elapsedTime === 0;
            resetButton.disabled = stopwatch.elapsedTime === 0;
            // Start button is always enabled initially unless running (which it isn't here)
            startButton.disabled = false;


            // Add event listeners
            startButton.addEventListener('click', () => stopwatch.start());
            stopButton.addEventListener('click', () => stopwatch.stop());
            resetButton.addEventListener('click', () => stopwatch.reset());

            row.appendChild(stopwatchDisplay);
            row.appendChild(taskInput);
            row.appendChild(startButton);
            row.appendChild(stopButton);
            row.appendChild(resetButton);

            return row;
        }


        // --- Local Storage Functions (Unchanged from previous working version) ---
        function updateLocalStorage() {
             // console.log("Updating local storage..."); // Debug log
            const rows = document.querySelectorAll('.row');
            const tasks = Array.from(rows).map(row => {
                const sw = row.stopwatch;
                return {
                    task_name: row.querySelector('.task-input').value,
                    elapsed_time: sw ? sw.formatTime(sw.isRunning ? Date.now() - sw.startTime : sw.elapsedTime) : row.querySelector('.stopwatch').textContent,
                    // A running timer is restored from its start time, so time keeps counting across reloads
                    running: !!(sw && sw.isRunning),
                    start_time: sw && sw.isRunning ? sw.startTime : null
                };
            });

            try {
                localStorage.setItem('taskTimers', JSON.stringify({
                    saved_at: Date.now(),
                    day: new Date().toDateString(),
                    tasks
                }));
            } catch (err) {
                console.error('Error saving to local storage:', err);
                showNotification('Could not save data locally. Storage might be full.', 'error');
            }
        }

        // Returns { savedAt, day, tasks } or null. Handles the older format (a bare array).
        function readLocalSnapshot() {
            try {
                const raw = JSON.parse(localStorage.getItem('taskTimers'));
                if (!raw) return null;
                if (Array.isArray(raw)) return { savedAt: 0, day: null, tasks: raw };
                return { savedAt: raw.saved_at || 0, day: raw.day || null, tasks: Array.isArray(raw.tasks) ? raw.tasks : [] };
            } catch (e) {
                return null;
            }
        }

        function renderTasks(tasks) {
            const rowsContainer = document.getElementById('rows');
            rowsContainer.innerHTML = '';
            let runningRow = null;
            tasks.forEach(task => {
                const row = createRow(task.elapsed_time, task.task_name);
                if (task.running && task.start_time) {
                    row.stopwatch.elapsedTime = Math.max(0, Date.now() - task.start_time);
                    row.stopwatch.displayElement.textContent = row.stopwatch.formatTime(row.stopwatch.elapsedTime);
                    runningRow = row;
                }
                rowsContainer.appendChild(row);
            });
            if (runningRow) runningRow.stopwatch.start();
        }

        function loadFromLocalStorage() {
             console.log("Loading from local storage..."); // Debug log
            try {
                const snapshot = readLocalSnapshot();
                const rowsContainer = document.getElementById('rows');
                rowsContainer.innerHTML = ''; // Clear existing rows before loading

                if (snapshot) {
                    const tasks = snapshot.tasks;
                    if (tasks.length > 0) {
                         renderTasks(tasks);
                         console.log(`Loaded ${tasks.length} tasks from local storage.`);
                    } else {
                         console.log("Local storage had empty task list, adding default row.");
                         addRow(); // Add one default row if local storage was empty array
                    }
                } else {
                    console.log("No data in local storage, adding default row.");
                    addRow(); // Add default row if nothing was saved
                }
            } catch (err) {
                console.error('Error loading from local storage:', err);
                 showNotification('Could not load local data. Starting fresh.', 'error');
                const rowsContainer = document.getElementById('rows');
                rowsContainer.innerHTML = ''; // Clear potentially broken state
                addRow(); // Add default row on error
            }
        }

        function timeStringToMilliseconds(timeString) {
            try {
                const parts = timeString.match(/(\d+):(\d+)\.(\d+)/);
                if (!parts) return 0;
                const minutes = parseInt(parts[1], 10);
                const seconds = parseInt(parts[2], 10);
                const msTenths = parseInt(parts[3], 10);
                return minutes * 60000 + seconds * 1000 + msTenths * 10;
            } catch (e) {
                console.error("Error parsing time string:", timeString, e);
                return 0;
            }
        }

        // --- Auto Backup Functions (Copied from previous working version) ---
         async function performAutoSweep(isManualTrigger = false) {
            console.log(`Performing sweep (Manual: ${isManualTrigger})...`);
            const rows = document.querySelectorAll('.row');
            if (rows.length === 0) {
                console.log("Auto-sweep skipped: No rows.");
                return;
            }

            let hasNonEmptyTask = false;
             const tasks = Array.from(rows).map(row => {
                 const taskName = row.querySelector('.task-input').value.trim();
                 if (taskName !== '') {
                     hasNonEmptyTask = true;
                 }
                 return {
                     task_name: taskName, // Send trimmed name
                     elapsed_time: row.querySelector('.stopwatch').textContent
                 };
             });

            if (!hasNonEmptyTask && !isManualTrigger) {
                console.log("Auto-sweep skipped: All task names are empty.");
                 scheduleNextBackup();
                updateBackupStatus();
                return;
            }

            console.log(`Backing up ${tasks.length} task entries...`);
            logDebug(`Backup data: ${JSON.stringify(tasks)}`);

            try {
                const response = await fetch('/api/save_tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tasks)
                });

                 const responseText = await response.text();
                 logDebug(`Backup response status: ${response.status}`);
                 logDebug(`Backup raw response: ${responseText}`);

                if (response.ok) {
                    let result = {};
                     try { result = JSON.parse(responseText); } catch(e){ logDebug("Couldn't parse success response as JSON");}

                    sessionLastBackupTime = new Date();
                    fetchedLastBackupISOString = sessionLastBackupTime.toISOString();
                    scheduleNextBackup();
                    updateBackupStatus();

                    const successMsg = result.message || 'Backup completed successfully';
                     if (isManualTrigger) {
                          showNotification(successMsg, "success");
                     }
                    console.log("Sweep successful:", successMsg);
                    logDebug(`Sweep successful: ${successMsg}`);

                } else {
                     let errorMsg = `Backup failed with status ${response.status}`;
                     try {
                         const errorResult = JSON.parse(responseText);
                         errorMsg = errorResult.error || errorMsg;
                     } catch(e){ /* Ignore if response wasn't JSON */ }

                    console.error("Sweep failed:", errorMsg);
                    logDebug(`Sweep failed: ${errorMsg}`);
                    showNotification(`Backup failed: ${errorMsg}`, "error");
                     scheduleNextBackup();
                     updateBackupStatus();
                }
            } catch (err) {
                console.error('Sweep network/fetch error:', err);
                 logDebug(`Sweep network/fetch error: ${err.message}`);
                showNotification("Backup failed: " + err.message, "error");
                 scheduleNextBackup();
                 updateBackupStatus();
            }
        }

        function scheduleNextBackup() {
            const now = new Date();
            const minutes = now.getMinutes();
            const minutesToAdd = 15 - (minutes % 15);
            nextScheduledBackup = new Date(now.getTime() + minutesToAdd * 60 * 1000);
            nextScheduledBackup.setSeconds(0);
            nextScheduledBackup.setMilliseconds(0);

            if (nextScheduledBackup.getTime() <= now.getTime() + 1000) {
                nextScheduledBackup.setTime(nextScheduledBackup.getTime() + 15 * 60 * 1000);
            }

            const timeUntilNextBackup = nextScheduledBackup.getTime() - now.getTime();
            if (backupTimeout) {
                clearTimeout(backupTimeout);
            }

            console.log(`Next backup scheduled at ${nextScheduledBackup.toLocaleTimeString()} (in ${Math.round(timeUntilNextBackup/1000)} seconds)`);
            logDebug(`Next backup scheduled: ${nextScheduledBackup.toISOString()} (in ${timeUntilNextBackup}ms)`);

            backupTimeout = setTimeout(() => {
                console.log("Scheduled backup time reached. Performing auto-sweep.");
                logDebug("Backup timeout triggered. Performing auto-sweep.");
                performAutoSweep(false);
            }, timeUntilNextBackup);

            updateBackupStatus();
        }

        function updateBackupStatus() {
            const backupStatus = document.getElementById('backup-status');
            if (!backupStatus) {
                 // console.warn("Backup status element not found in updateBackupStatus.");
                 return;
             }

            const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let statusHTML = '';
            let displayTime = null;

            if (sessionLastBackupTime) {
                displayTime = sessionLastBackupTime;
            } else if (fetchedLastBackupISOString) {
                try {
                    displayTime = new Date(fetchedLastBackupISOString);
                    if (isNaN(displayTime)) throw new Error("Invalid Date parsed");
                } catch (e) {
                    console.error("Error parsing fetchedLastBackupISOString:", fetchedLastBackupISOString, e);
                    logDebug(`Error parsing fetched backup time: ${fetchedLastBackupISOString}`);
                    displayTime = null;
                }
            }

            if (displayTime) {
                const formattedLastTime = displayTime.toLocaleString(undefined, options);
                statusHTML += `Last backup: ${formattedLastTime} [${timezone}]`;
                backupStatus.style.color = '#4CAF50'; // Green
            } else {
                statusHTML += 'No backup performed yet';
                backupStatus.style.color = '#FFA500'; // Orange
            }

            if (nextScheduledBackup) {
                const formattedNextTime = nextScheduledBackup.toLocaleString(undefined, options);
                statusHTML += `<br>Next backup: ${formattedNextTime}`;
            } else {
                 statusHTML += `<br>Next backup: Scheduling...`;
            }

            backupStatus.innerHTML = statusHTML;
        }

        function setupBackupSystem() {
            let backupStatus = document.getElementById('backup-status');
            if (!backupStatus) {
                const container = document.getElementById('container');
                if (!container) { console.error("Container element not found for backup status."); return; }

                backupStatus = document.createElement('div');
                backupStatus.id = 'backup-status';
                // Apply styles matching the original intent (ensure CSS covers #backup-status styling)
                backupStatus.style.cssText = 'text-align: center; margin-top: 20px; font-size: 12px; color: #FFA500; line-height: 1.5; padding: 5px; background-color: rgba(0,0,0,0.05); border-radius: 4px;'; // Re-apply basic style needed if CSS doesn't define it
                backupStatus.innerHTML = 'Initializing backup status...';

                const controlsDiv = container.querySelector('.controls');
                if (controlsDiv && controlsDiv.parentNode === container) {
                     container.insertBefore(backupStatus, controlsDiv.nextSibling);
                     console.log("Created backup status element after controls.");
                } else {
                    container.appendChild(backupStatus); // Fallback append to container end
                     console.log("Created backup status element at end of container.");
                }
            } else {
                 console.log("Backup status element already exists.");
            }
            scheduleNextBackup();
        }

        // --- Data Loading Functions (Copied from previous working version) ---
        async function loadDate() {
            // console.log("Loading date...");
            try {
                const response = await fetch('/api/get_date');
                if (!response.ok) throw new Error(`Date fetch failed: ${response.status}`);
                const data = await response.json();
                document.querySelector('h1').textContent = `Ultradian rhythm - ${data.date}`;
                // console.log("Date loaded:", data.date);
            } catch (err) {
                console.error('Error loading date:', err);
                const today = new Date().toLocaleDateString();
                document.querySelector('h1').textContent = `Ultradian rhythm - ${today} (offline)`;
                showNotification('Could not load date from server', 'warning');
            }
        }

         async function loadTasks() {
             // console.log("Loading tasks...");
             try {
                 const response = await fetch('/api/get_tasks');
                 if (!response.ok) {
                     throw new Error(`Server returned ${response.status} for tasks`);
                 }
                 const tasks = await response.json();

                 if (!tasks || tasks.length === 0) {
                     console.log("No tasks from server, trying local storage.");
                     loadFromLocalStorage();
                     return;
                 }

                 // Don't let an older server backup (taken up to 15 min ago) overwrite newer progress
                 // made in this browser, e.g. a timer that was running when the page was reloaded.
                 const local = readLocalSnapshot();
                 const serverTime = fetchedLastBackupISOString ? new Date(fetchedLastBackupISOString).getTime() : 0;
                 if (local && local.tasks.length && local.day === new Date().toDateString() && local.savedAt >= serverTime) {
                     console.log("Local data is newer than the last server backup; using it.");
                     loadFromLocalStorage();
                     return;
                 }

                 console.log(`Loading ${tasks.length} tasks from server.`);
                 renderTasks(tasks);
                 updateLocalStorage();

             } catch (err) {
                 console.error('Error loading tasks from server:', err);
                 showNotification('Could not load tasks from server. Loading local backup...', 'warning');
                 loadFromLocalStorage();
             }
         }

        // --- Manual Save / Sweep Function (Copied from previous working version) ---
        async function sweepTasks() {
            logDebug("Sweep tasks button clicked.");
            if (!confirm("Save current progress to the server? This will overwrite today's previously saved data.")) {
                 logDebug("Manual save cancelled by user.");
                 return;
             }

            const saveButton = document.getElementById('sweep-button');
            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';
            logDebug("Manual save initiated...");

            const rows = document.querySelectorAll('.row');
            let hasEmptyTasks = false;
            let hasRunningTimers = false;

            rows.forEach(row => {
                const taskInput = row.querySelector('.task-input');
                const taskName = taskInput.value.trim();
                if (taskName === '') {
                    hasEmptyTasks = true;
                    taskInput.classList.add('error');
                } else {
                    taskInput.classList.remove('error');
                }
                if (row.stopwatch && row.stopwatch.isRunning) {
                     hasRunningTimers = true;
                 }
            });

            if (hasEmptyTasks) {
                showNotification('Please fill in all task names before saving', 'error');
                logDebug("Manual save aborted: Empty task names found");
                 saveButton.disabled = false;
                 saveButton.textContent = 'Save Progress';
                return;
            }

             if (hasRunningTimers) {
                  showNotification('Stopping active timers before saving...', 'warning');
                  logDebug("Active timers found, stopping them before manual save.");
                  rows.forEach(row => {
                     if (row.stopwatch && row.stopwatch.isRunning) {
                         row.stopwatch.stop();
                     }
                 });
                 await new Promise(resolve => setTimeout(resolve, 100));
             }

            await performAutoSweep(true);

            saveButton.disabled = false;
            saveButton.textContent = 'Save Progress';
            logDebug("Manual save process finished.");
        }

        // --- Notification Utility (Copied from previous working version) ---
        function showNotification(message, type = 'info') {
            let notificationArea = document.getElementById('notification-area');
            if (!notificationArea) {
                notificationArea = document.createElement('div');
                notificationArea.id = 'notification-area';
                document.body.appendChild(notificationArea);
                // Styles MUST be defined in the <style> block for consistency now
                // notificationArea.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;';
                 console.log("Created notification area dynamically (ensure CSS styles it).");
            }

            const notification = document.createElement('div');
            // Rely entirely on CSS classes defined in <style>
            notification.className = `notification ${type}`;
            notification.textContent = message;
            notificationArea.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('fade-out');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 500);
            }, 5000);
        }

         // --- Debug Panel Utility (Copied from previous working version) ---
         function logDebug(message) {
            const debugPanel = document.getElementById('debug-panel');
            // Only log if panel exists and is visible
            if (debugPanel && debugPanel.style.display !== 'none') {
                const time = new Date().toLocaleTimeString();
                 const safeMessage = String(message).replace(/</g, "&lt;").replace(/>/g, "&gt;");
                debugPanel.innerHTML += `<div>[${time}] ${safeMessage}</div>`;
                debugPanel.scrollTop = debugPanel.scrollHeight;
            }
             // console.log(`DEBUG: ${message}`); // Optional console logging
        }

        // --- Initialization (Copied from previous working version) ---
        async function loadInitialState() {
            console.log("Loading initial state...");
            logDebug("Loading initial state...");
            await loadDate();

            const fetchLastBackup = fetch('/api/get_last_backup_time')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    if (data && data.last_backup_time) {
                        fetchedLastBackupISOString = data.last_backup_time;
                        logDebug(`Workspaceed last backup time: ${fetchedLastBackupISOString}`);
                    } else {
                         logDebug("No last backup time found in DB.");
                        fetchedLastBackupISOString = null;
                    }
                })
                .catch(err => {
                    console.error('Error loading last backup time:', err);
                    logDebug(`Error loading last backup time: ${err.message}`);
                    showNotification('Could not load last backup status.', 'warning');
                    fetchedLastBackupISOString = null;
                });

            try {
                // Backup time is needed first to decide whether server or local data is newer
                await fetchLastBackup;
                await loadTasks();
                 logDebug("Initial state loaded (backup time and tasks).");
            } catch (error) {
                console.error("Error during parallel initial state loading:", error);
                 logDebug(`Error during parallel initial state loading: ${error.message}`);
            }

            logDebug("Setting up backup system...");
            setupBackupSystem();
        }

        // --- Window Load Event (Copied from previous working version) ---
        window.onload = function () {
             console.log("Window loaded.");
            loadInitialState();

            document.getElementById('add-row').onclick = addRow;
            document.getElementById('remove-row').onclick = removeRow;
            document.getElementById('sweep-button').onclick = sweepTasks;

            // Keep the saved snapshot current when the tab is hidden or closed
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') updateLocalStorage(); });
            window.addEventListener('pagehide', updateLocalStorage);

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); sweepTasks(); return; }
                 if (document.activeElement.tagName === 'INPUT') return;
                if (e.altKey && e.key === 'a') { e.preventDefault(); addRow(); }
                if (e.altKey && e.key === 'd') { e.preventDefault(); removeRow(); }
                if (e.altKey && e.key === 'b') { e.preventDefault(); showNotification("Manual backup initiated...", "info"); performAutoSweep(true); }
            });
             logDebug("Page loaded, initial state loading initiated.");
        };

        // ===========================================================
        // END: JAVASCRIPT LOGIC FOR PERSISTENCE
        // ===========================================================
    </script>
    <style>
        /* --- All CSS exactly as provided in the FIRST prompt --- */
       body {
           font-family: Arial, sans-serif;
           margin: 0;
           padding: 0;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           min-height: 100vh;
